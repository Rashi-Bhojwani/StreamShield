name: Foundation and streaming checks
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:platform
      - run: npm run lint && npm run format:check && npm run typecheck && npm test && npm run build
      - run: docker compose config --quiet
      - run: docker compose up --build --wait
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run test:platform
      - run: npm run test:e2e
      - run: npm run test:media
      - run: npm run test:media:platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        run: docker compose down

  resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:resilience
      - run: node infrastructure/resilience/compose.mjs config --quiet
      - run: npm run resilience:up
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run resilience:probe
      - run: npm run test:e2e
      - run: npm run test:resilience
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resilience-results
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        run: if [ -f .local/resilience/compose.yml ]; then npm run resilience:down; fi

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:monitoring
      - run: node infrastructure/monitoring/compose.mjs config --quiet
      - run: npm run monitoring:up
      - run: npm run monitoring:probe
      - run: node infrastructure/monitoring/compose.mjs exec -T --user 1001:1001 observer node -e "JSON.parse(require('node:fs').readFileSync('/config/targets.json','utf8'))"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run test:monitoring
      - run: npm run test:resilience:monitoring
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitoring-results
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        run: if [ -f .local/monitoring/compose.yml ]; then npm run monitoring:down; fi

  healing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:healing -- --enable-local-repairs
      - run: node infrastructure/healing/compose.mjs config --quiet
      - run: npm run healing:up
      - run: npm run healing:probe
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run test:healing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: healing-results
          path: test-results/
          if-no-files-found: ignore
      - if: always()
        run: if [ -f .local/healing/compose.yml ]; then npm run healing:down; fi
